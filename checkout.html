<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finalizar Pedido - Delícia de Cupcakes</title>

    <link rel="stylesheet" href="src/styles/styles.css">
    <link rel="stylesheet" href="src/styles/checkout.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>


</head>

<body>

    <main id="checkout">

            <h1 class="checkout-title-desktop">Finalizar Pedido</h1>

            <div class="checkout-mobile-header">
                <a href="index.html?abrirCarrinho=true" class="checkout-back">
                    ←
                </a>

                <h1>Finalize sua compra</h1>
            </div>

        <section id="checkout_content">

            <!-- DADOS DO CLIENTE -->

            <div id="customer_data">

                <h2>Dados para o pedido</h2>

                <div class="form-group">

                    <label for="name">
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Digite seu nome completo"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com">

                </div>

                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input
                        type="text"
                        id="cep"
                        placeholder="00000-000"
                        maxlength="9"
                    >
                </div>

                <div class="form-group">

                    <label for="city">
                        Cidade
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Digite sua cidade"
                    >

                </div>


                <div class="form-group">

                    <label for="state">
                        Estado
                    </label>

                    <input
                        type="text"
                        id="state"
                        placeholder="Ex.: SP"
                        maxlength="2"
                    >

                </div>

                <div class="form-group">

                    <label for="address">
                        Endereço
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Rua, Avenida ..."
                    >

                </div>


                <div class="form-group">

                    <label for="number">
                        Número
                    </label>

                    <input
                        type="text"
                        id="number"
                        placeholder="Número da residência">

                </div>

                <div class="form-group">

                    <label for="complement">
                        Complemento
                    </label>

                    <input
                        type="text"
                        id="complement"
                        placeholder="Apartamento, bloco ...">

                </div>
            </div>

            <div id="shipping_info">
                <i class="fa-solid fa-truck"></i>

                <div>
                    <h2>Frete</h2>
                    <span>Enviamos para todo Brasil</span>
                    <b id="shipping_value">R$ 0,00</b>
                    <span>(O frete atualizará em conformidade com o CEP informado)</span>
                </div>
            </div>

            <div id="payment_method">

                <h2>Forma de pagamento</h2>

                <label>
                    <input type="radio" name="payment" value="Cartão">
                    💳 Cartão
                </label>

                <div id="installments">

                    <h3>Parcele em até 3x</h3>

                    <label>
                        <input
                            type="radio"
                            name="installment"
                            value="1"
                        >
                        <span>1x</span>
                        <strong class="installment-value">R$ 0,00</strong>
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="installment"
                            value="2"
                        >
                        <span>2x</span>
                        <strong class="installment-value">R$ 0,00</strong>
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="installment"
                            value="3"
                        >
                        <span>3x</span>
                        <strong class="installment-value">R$ 0,00</strong>
                    </label>

                </div>

                <label>
                    <input type="radio" name="payment" value="Pix">
                    📱 Pix
                </label>

                <label>
                    <input type="radio" name="payment" value="Boleto">
                    🧾 Boleto
                </label>

            </div>



            <!----- RESUMO DO PEDIDO ----->

            <div id="order_summary">

                <h2>Resumo do pedido</h2>

                <div id="checkout_items">
                    <!-- Produtos serão inseridos pelo JavaScript -->
                </div>

                <div id="checkout_subtotal">
                    <span>Subtotal:</span>
                    <strong>R$ 0,00</strong>
                </div>

                <div id="checkout_shipping">
                    <span>Frete:</span>
                    <strong id="checkout_shipping_value">R$ 0,00</strong>
                </div>

                <div id="checkout_total">
                    <span>Total:</span>
                    <strong>R$ 0,00</strong>
                </div>

                <button
                    class="btn-default"
                    id="confirm_order">

                    Confirmar pedido

                </button>

                <button
                    class="btn-default"
                    id="back_to_shopping">

                    Voltar às compras

                </button>

            </div>

        </section>

    </main>


    <script src="src/javascript/checkout.js"></script>

</body>

</html>
